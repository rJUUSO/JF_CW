name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2026.10.22)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ -z "$TAG" ]] && { echo "Tag is empty" >&2; exit 1; }
          [[ "$TAG" != v* ]] && { echo "Tag must start with 'v' (got: $TAG)" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO + esptool
        run: python -m pip install --upgrade pip platformio esptool

      - name: Build firmware and the LittleFS images
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          B=.pio/build/juusoflux-coworker
          mkdir -p release
          JF_FW_VER="$VER" pio run -e juusoflux-coworker
          # One LittleFS image per settings file in data/ (as /coworker.toml).
          for f in data/coworker*.toml; do
            name=$(basename "$f" .toml)
            COWORKER_FS_CONFIG=$(basename "$f") pio run -e juusoflux-coworker -t buildfs
            cp "$B/littlefs.bin" "release/JF_COWORKER_${name}_littlefs_${VER}.bin"
          done

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          B=.pio/build/juusoflux-coworker
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -1)
          # Single image for a first flash at 0x0 (default_8MB.csv: app0 @ 0x10000,
          # spiffs / LittleFS @ 0x670000) with data/coworker.toml.
          python -m esptool --chip esp32s3 merge_bin \
            -o "release/JF_COWORKER_full_${VER}.bin" \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$B/firmware.bin" \
            0x670000 "release/JF_COWORKER_coworker_littlefs_${VER}.bin"
          cp "$B/firmware.bin" "release/JF_COWORKER_firmware_${VER}.bin"
          ( cd release && sha256sum *.bin > "SHA256SUMS_${VER}.txt" )
          echo "release_dir=release" >> "$GITHUB_OUTPUT"

      - name: Delete existing release for tag (if present)
        uses: actions/github-script@v7
        env:
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TARGET_TAG;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: existing.data.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.release_dir }}/*.bin
            ${{ steps.assets.outputs.release_dir }}/SHA256SUMS_*.txt
